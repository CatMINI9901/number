<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やまびこ文字起こし</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      color: #00e676;
    }
    .status-bar {
      text-align: center;
      padding: 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      background-color: #2a2a2a;
      color: #aaa;
      transition: all 0.3s ease;
    }
    .status-bar.listening {
      background-color: #004d40;
      color: #80cbc4;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
    }
    .status-bar.speaking {
      background-color: #4a148c;
      color: #e1bee7;
      box-shadow: 0 0 12px rgba(171, 71, 188, 0.3);
    }
    .btn-toggle {
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: #00e676;
      color: #000;
      transition: transform 0.1s, background 0.2s;
    }
    .btn-toggle:active {
      transform: scale(0.98);
    }
    .btn-toggle.active {
      background: #ff5252;
      color: #fff;
    }
    .log-container {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      height: 350px;
      overflow-y: auto;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .user-text {
      color: #80d8ff;
      font-size: 1.05rem;
      word-break: break-all;
    }
    .echo-text {
      color: #b9f6ca;
      font-size: 0.95rem;
      padding-left: 16px;
      border-left: 2px solid #00e676;
      opacity: 0.85;
      font-style: italic;
    }
    .interim {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏔️ やまびこ文字起こし</h1>
  <div id="status" class="status-bar">停止中</div>
  <button id="toggleBtn" class="btn-toggle">やまびこ開始</button>

  <div id="log" class="log-container">
    <div id="interimDisplay" class="interim">ここにリアルタイムで声が入ります...</div>
  </div>
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  const toggleBtn = document.getElementById('toggleBtn');
  const statusDiv = document.getElementById('status');
  const logDiv = document.getElementById('log');
  const interimDisplay = document.getElementById('interimDisplay');

  let recognition = null;
  let isRunning = false;
  let isSpeaking = false;

  if (!SpeechRecognition) {
    statusDiv.textContent = 'お使いのブラウザは音声認識に対応していません（Chrome / Edge推奨）';
    toggleBtn.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true; // リアルタイム認識
    recognition.continuous = true;

    recognition.onstart = () => {
      if (!isSpeaking) {
        setStatus('listening', '🎤 あなたの声を聞いています...');
      }
    };

    recognition.onresult = (event) => {
      let interimText = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          // 判定確定時：ログに追加してやまびこ（読み上げ）を実行
          addLogEntry(transcript);
          interimDisplay.textContent = '';
          triggerEcho(transcript);
        } else {
          interimText += transcript;
        }
      }

      if (interimText) {
        interimDisplay.textContent = interimText;
        logDiv.scrollTop = logDiv.scrollHeight;
      }
    };

    recognition.onerror = (event) => {
      if (event.error !== 'no-speech' && event.error !== 'aborted') {
        console.error('Recognition error:', event.error);
      }
    };

    recognition.onend = () => {
      // ユーザーが停止していない、かつ読み上げ中でなければ自動再開
      if (isRunning && !isSpeaking) {
        try { recognition.start(); } catch(e) {}
      }
    };
  }

  // やまびこ処理（マイクを一旦止めて読み上げる）
  function triggerEcho(text) {
    if (!text.trim()) return;

    isSpeaking = true;
    recognition.stop(); // 自分の声をマイクが拾わないよう一時停止
    setStatus('speaking', '🔊 やまびこ返答中...');

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    utterance.rate = 1.1;  // やまびこ感を出すため少し早め
    utterance.pitch = 1.2; // 少し高めの音でやまびこ風に

    utterance.onend = () => {
      isSpeaking = false;
      if (isRunning) {
        setStatus('listening', '🎤 あなたの声を聞いています...');
        try { recognition.start(); } catch(e) {}
      } else {
        setStatus('stopped', '停止中');
      }
    };

    utterance.onerror = () => {
      isSpeaking = false;
      if (isRunning) try { recognition.start(); } catch(e) {}
    };

    window.speechSynthesis.speak(utterance);
  }

  // ログに結果を追加
  function addLogEntry(text) {
    const entry = document.createElement('div');
    entry.className = 'entry';

    const userLine = document.createElement('div');
    userLine.className = 'user-text';
    userLine.textContent = '🗣️ ' + text;

    const echoLine = document.createElement('div');
    echoLine.className = 'echo-text';
    echoLine.textContent = '⛰️ ' + text;

    entry.appendChild(userLine);
    entry.appendChild(echoLine);

    logDiv.insertBefore(entry, interimDisplay);
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function setStatus(state, message) {
    statusDiv.className = 'status-bar ' + state;
    statusDiv.textContent = message;
  }

  // ボタン操作
  toggleBtn.addEventListener('click', () => {
    if (isRunning) {
      isRunning = false;
      recognition.stop();
      window.speechSynthesis.cancel();
      toggleBtn.textContent = 'やまびこ開始';
      toggleBtn.classList.remove('active');
      setStatus('stopped', '停止中');
    } else {
      isRunning = true;
      toggleBtn.textContent = 'やまびこ停止';
      toggleBtn.classList.add('active');
      try { recognition.start(); } catch(e) {}
    }
  });
</script>

</body>
</html>
