<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Yamabiko</title>
    <style>
        :root {
            --active-color: #00d2d3;
            --idle-color: #54a0ff;
            --bg: #1e272e;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-off { background: #485460; }
        .status-on { background: var(--active-color); animation: blink 1s infinite; }
        
        @keyframes blink {
            50% { opacity: 0.6; }
        }

        .display {
            font-size: 2.5rem;
            text-align: center;
            margin: 20px;
            min-height: 100px;
            color: var(--active-color);
            word-break: break-all;
            padding: 0 20px;
        }

        #micBtn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: var(--idle-color);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(84, 160, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #micBtn.active {
            background: var(--active-color);
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(0, 210, 211, 0.6);
        }

        svg { fill: white; width: 40px; height: 40px; }

        .hint {
            margin-top: 30px;
            color: #808e9b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="badge" class="status-badge status-off">Standby</div>
    <div id="display" class="display">Tap to Start</div>

    <button id="micBtn">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div class="hint">もう一度押すまで、ずっとあなたのマネをします。</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const badge = document.getElementById('badge');
    const display = document.getElementById('display');

    let isListening = false;

    // 音声認識の設定
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();

    recognition.lang = 'en-US'; 
    recognition.continuous = true; // ずっと聞き続ける設定
    recognition.interimResults = false;

    // 音声合成
    const synth = window.speechSynthesis;

    function echo(text) {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = recognition.lang;
        uttr.rate = 1.0;
        uttr.pitch = 1.5; // 少し高めのやまびこボイス
        synth.speak(uttr);
    }

    recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript;
        
        display.textContent = transcript;
        echo(transcript);
    };

    // 万が一エラーで止まっても、ON状態なら再起動する
    recognition.onend = () => {
        if (isListening) {
            recognition.start();
        }
    };

    micBtn.addEventListener('click', () => {
        if (!isListening) {
            // ONにする
            isListening = true;
            recognition.start();
            micBtn.classList.add('active');
            badge.textContent = "Listening...";
            badge.className = "status-badge status-on";
            display.textContent = "I'm listening...";
        } else {
            // OFFにする
            isListening = false;
            recognition.stop();
            synth.cancel();
            micBtn.classList.remove('active');
            badge.textContent = "Standby";
            badge.className = "status-badge status-off";
            display.textContent = "Stopped";
        }
    });
</script>
</body>
</html>
